name: Money Flow Daily Run
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  daily-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas numpy openpyxl requests
      - name: Run screener (300-stock universe)
        run: python screener.py
      - name: Run turnaround screener
        run: python turnaround.py
      - name: Run picks engine
        run: python picks.py
      - name: Run tracker
        run: python tracker.py
      - name: Run dashboard
        run: python dashboard.py
      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f money_flow_history.db \
                     money_flow_report.html \
                     turnaround_report.html \
                     picks_report.html \
                     tracker_report.html \
                     analytics_dashboard.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: daily-reports
          path: |
            money_flow_report.html
            turnaround_report.html
            picks_report.html
            tracker_report.html
            analytics_dashboard.html
          retention-days: 90
